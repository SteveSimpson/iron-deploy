services:
# infra
  logger:
    hostname: logger
    container_name: logger
    image: amir20/dozzle:latest
    ports:
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  haproxy:
    image: haproxy:latest
    hostname: haproxy
    container_name: haproxy
    ports:
      - "80:80"
      - "443:443"
      - "1936:1936" # Stats UI
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./.ca/combined.pem:/etc/ssl/certs/combined.pem:ro
  maildev:
    image: maildev/maildev
    hostname: maildev
    container_name: maildev
    restart: always
    environment:
      - TZ=America/New_York
      - MAILDEV_WEB_PORT=1080
      - MAILDEV_SMTP_PORT=1025
      - MAILDEV_MAIL_DIRECTORY=/var/data
    ports:
      - "8080:1080"
      - "1025:1025"
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
    volumes:
      - ./maildev/data:/var/data
  mockserver:
    image: mockserver/mockserver:5.15.0
    hostname: mockserver
    container_name: mockserver
    ports:
      - 1080:1080
    environment:
      MOCKSERVER_PROPERTY_FILE: /config/mockserver.properties
      MOCKSERVER_INITIALIZATION_JSON_PATH: /config/initializerJson.json
    volumes:
      - ./mockserver/config:/config

  gitlab:
    image: 'gitlab/gitlab-ce:latest'
    hostname: gitlab
    container_name: gitlab
    ports:
      - '8088:80'
    env_file:
      - ./gitlab.env
    volumes:
      - ./gitlab/config:/etc/gitlab
      - ./gitlab/data:/var/opt/gitlab

  nifi:
    hostname: nifi
    container_name: nifi
    image: apache/nifi:latest
    env_file:
      - ./nifi.env
    ports:
      - '8443:8443'
    volumes:
      - nifi_local_i1:/opt/nifi/nifi-current

  elasticsearch:
    image: elasticsearch:7.9.1
    container_name: elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - test_data:/usr/share/elasticsearch/data/
      - ./elk-config/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
    environment:
      - discovery.type=single-node
      - http.host=0.0.0.0
      - transport.host=0.0.0.0
      - xpack.security.enabled=false
      - xpack.monitoring.enabled=false
      - cluster.name=elasticsearch
      - bootstrap.memory_lock=true

  logstash:
    image: logstash:7.9.1 
    container_name: logstash
    ports:
      - "5044:5044"
      - "9600:9600"
    volumes:
      - ./elk/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
      - ./elk/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml
      - ls_data:/usr/share/logstash/data
    depends_on:
      - elasticsearch

  kibana:
    image: kibana:7.9.1
    container_name: kibana
    ports:
      - "5601:5601"
    volumes:
      - ./elk/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml
      - kb_data:/usr/share/kibana/data
    networks:
      - elk
    depends_on:
      - elasticsearch

volumes:
  nifi_local_i1:
    driver: local
  test_data:
    driver: local
  ls_data:
    driver: local
  kb_data:
    driver: local

